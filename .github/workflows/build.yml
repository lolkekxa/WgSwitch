name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # подтверждение сборки (attestation)
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # тег v1.2.0 → 1.2.0; main → версия из csproj + номер сборки (1.2.0-dev.57)
      - name: Version
        id: ver
        run: |
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $v = '${{ github.ref_name }}'.Substring(1)
            $suffix = "-$v"
            $file = ($v -split '-')[0] + '.0'   # v1.2.0-beta → 1.2.0.0
          } else {
            $base = ([xml](Get-Content WgSwitch.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-dev.${{ github.run_number }}"
            $suffix = ''
            $file = "$base.${{ github.run_number }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "file=$file" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test tests/WgSwitch.Tests/WgSwitch.Tests.csproj -c Release

      - name: Publish lite (needs .NET 8 Desktop Runtime)
        run: dotnet publish WgSwitch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o out/lite

      - name: Publish portable (.NET inside)
        run: dotnet publish WgSwitch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o out/full

      - name: Publish for installer (.NET inside, uncompressed — LZMA of the installer packs it better)
        run: dotnet publish WgSwitch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o out/setup

      - name: Installer
        run: |
          # своя копия Inno Setup 6.7.3: тёмной темы в установщике нет в версиях старше 6.6, а на раннере может стоять такая
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile is.exe
          Start-Process .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir" -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          & $iscc installer\WgSwitch.iss "/DAppVersion=${{ steps.ver.outputs.version }}" "/DFileVersion=${{ steps.ver.outputs.file }}" "/DSourceExe=$PWD\out\setup\WgSwitch.exe" "/O$PWD\out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android tests
        run: |
          Push-Location android
          ./gradlew.bat --no-daemon :app:testDebugUnitTest
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }

      - name: Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WGS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WGS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WGS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $missing = @('KEYSTORE_B64', 'WGS_KEYSTORE_PASSWORD', 'WGS_KEY_ALIAS', 'WGS_KEY_PASSWORD') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            if ('${{ github.ref }}' -like 'refs/tags/v*') {
              throw "Нужны GitHub Actions secrets для подписи Android APK: $($missing -join ', ')"
            }
            Write-Host '::warning::Не заданы секреты подписи Android — APK не собирается'
            exit 0
          }
          $env:WGS_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.jks'
          [IO.File]::WriteAllBytes($env:WGS_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_B64))
          try {
            Push-Location android
            ./gradlew.bat --no-daemon "-PappVersion=${{ steps.ver.outputs.version }}" :app:assembleRelease
            $code = $LASTEXITCODE
          } finally {
            Pop-Location
            Remove-Item $env:WGS_KEYSTORE -Force
          }
          if ($code -ne 0) { exit $code }
          Copy-Item android/app/build/outputs/apk/release/app-release.apk out/WgSwitch.apk

      - name: Collect files and checksums
        run: |
          $s = '${{ steps.ver.outputs.suffix }}'
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out\WgSwitch-Setup.exe "dist\WgSwitch-Setup$s.exe"
          Copy-Item out\full\WgSwitch.exe "dist\WgSwitch-portable$s.exe"
          Copy-Item out\lite\WgSwitch.exe "dist\WgSwitch-lite$s.exe"
          if (Test-Path out\WgSwitch.apk) { Copy-Item out\WgSwitch.apk "dist\WgSwitch$s.apk" }
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.apk' } |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      # подтверждение сборки: GitHub подписывает каждый файл, и «gh attestation verify» покажет, каким workflow
      # и из какого коммита он собран — подменённый файл проверку не пройдёт
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push'
        with:
          subject-path: |
            dist/*.exe
            dist/*.apk

      # артефакты делят квоту хранилища со всем аккаунтом — если она кончилась, сборку это не валит
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: WgSwitch
          path: dist/*
          retention-days: 3

      - name: Release notes
        if: github.event_name == 'push'
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $s = '${{ steps.ver.outputs.suffix }}'
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $changelog = Get-Content CHANGELOG.md -Raw
            $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
            $intro = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          } else {
            $intro = "Сборка из ``main`` ($('${{ github.sha }}'.Substring(0, 7))). Для постоянной версии берите [последний релиз](https://github.com/${{ github.repository }}/releases/latest)."
          }
          $sums = Get-Content dist\SHA256SUMS.txt -Raw
          $apk = if (Test-Path "dist\WgSwitch$s.apk") { "| ``WgSwitch$s.apk`` | Android 8+: движок AmneziaWG встроен, отдельный клиент не нужен |" } else { $null }
          $nl = [Environment]::NewLine
          $body = @(
            $intro, '',
            '### Какой файл скачать', '',
            '| Файл | Для чего |', '|---|---|',
            "| ``WgSwitch-Setup$s.exe`` | установщик (~45 МБ): всё внутри, по галочке поставит WireGuard |",
            "| ``WgSwitch-portable$s.exe`` | один файл без установки, .NET внутри |",
            "| ``WgSwitch-lite$s.exe`` | 0.7 МБ, нужен [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |",
            $apk, '',
            'Windows может предупредить о неизвестном издателе — [почему и что делать](https://github.com/${{ github.repository }}#-предупреждение-windows).', '',
            '### SHA-256', '', '```', $sums.Trim(), '```'
          ) -join $nl
          Set-Content release-notes.md $body -Encoding utf8

      # main → пре-релиз «dev», который перезаписывается; старый релиз «latest» больше не нужен
      - name: Move tag «dev» to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev
          git push -f origin dev
          exit 0

      - name: Release «dev»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Сборка из main · ${{ steps.ver.outputs.version }}
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: dist/*

      # тег v1.2.0 → постоянный релиз, на него ведёт ссылка «последний релиз»
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WgSwitch ${{ steps.ver.outputs.version }}
          make_latest: true
          body_path: release-notes.md
          files: dist/*
