name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (single file, needs .NET 8 Desktop Runtime)
        run: dotnet publish WgSwitch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out

      # артефакты делят квоту хранилища со всем аккаунтом — если она кончилась, сборку это не валит
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: WgSwitch
          path: out/WgSwitch.exe
          retention-days: 3

      # главное место для exe — релизы: они в квоту артефактов не входят.
      # Каждый пуш в main обновляет пре-релиз «latest», тег v1.2.0 создаёт обычный релиз.
      - name: Move tag «latest» to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Release «latest»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (main)
          prerelease: true
          body: Последняя сборка из main (${{ github.sha }}). Нужен .NET 8 Desktop Runtime.
          files: out/WgSwitch.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/WgSwitch.exe
