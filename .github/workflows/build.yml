name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (single file, needs .NET 8 Desktop Runtime)
        run: dotnet publish WgSwitch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: WgSwitch
          path: out/WgSwitch.exe
          if-no-files-found: error

      # тег вида v1.2.0 — ещё и релиз с exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/WgSwitch.exe
